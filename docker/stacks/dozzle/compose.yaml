services:
  dozzle:
    image: 'amir20/dozzle:v10.7.5'
    restart: unless-stopped
    volumes:
      - 'data:/data'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/srv/dozzle/data/users.yaml:/data/users.yaml'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      - 'DOZZLE_AUTH_PROVIDER=simple'

volumes:
  data:
