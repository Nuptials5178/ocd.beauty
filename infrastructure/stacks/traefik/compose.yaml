services:
  traefik:
    image: "traefik:v3.7.12"
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - "lets_encrypt:/lets_encrypt"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./etc/traefik/traefik.yaml:/etc/traefik/traefik.yaml"
    ports:
      - "80:80"
      - "443:443"

networks:
  proxy:
    external: true

volumes:
  lets_encrypt:
