log:
  level: "INFO"

certificatesResolvers:
  letsEncrypt:
    acme:
      email: "nuptials5178@ocd.beauty"
      storage: "/lets_encrypt/acme.json"
      tlsChallenge: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: webSecure
          scheme: "https"

  webSecure:
    address: ":443"
    aliasHeadersStrategy: "delete"
    http:
      tls:
        certResolver: letsEncrypt

providers:
  docker:
    exposedByDefault: false
    network: proxy
